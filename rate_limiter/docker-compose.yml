services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      DEFAULT_ALGORITHM: sliding_window
      DEFAULT_LIMIT: "100"
      DEFAULT_WINDOW_SEC: "60"
    depends_on:
      redis:
        condition: service_healthy
