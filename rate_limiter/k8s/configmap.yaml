apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limiter-config
  labels:
    app: rate-limiter
data:
  HTTP_ADDR: ":8080"
  REDIS_ADDR: "redis:6379"
  REDIS_KEY_PREFIX: "rl"
  DEFAULT_ALGORITHM: "sliding_window"
  DEFAULT_LIMIT: "100"
  DEFAULT_WINDOW_SEC: "60"
  DEFAULT_REFILL_RATE: "10"
